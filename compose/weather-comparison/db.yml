services:
  weather-comparison-db:
    extends:
      file: ../../compose/common/postgres-db.base.yml
      service: postgres-db-base
    container_name: weather-comparison-db
    environment:
      POSTGRES_DB: weather_comparison_db
    ports:
      - "54324:5432"
    volumes:
      - weather_comparison_db_data:/var/lib/postgresql/data
