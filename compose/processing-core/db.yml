services:
  processing-core-db:
    extends:
      file: ../../compose/common/postgres-db.base.yml
      service: postgres-db-base
    container_name: processing-core-db
    environment:
      POSTGRES_DB: processing_core_db
    ports:
      - "54322:5432"
    volumes:
      - processing_core_db_data:/var/lib/postgresql/data